<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>校長選考 練習アプリ（Android・LINE用）</title>
<style>body{font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;background:#E7E9E3;color:#18262A;margin:0;padding:24px 16px;line-height:1.8}
main{max-width:560px;margin:0 auto;background:#FCFCFA;border:1px solid #CFD5CD;border-radius:12px;padding:22px}
h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:21px;margin:0 0 6px}
h2{font-size:13px;letter-spacing:.1em;color:#6E7C78;margin:20px 0 0;font-weight:500}
a.app{display:block;margin:12px 0;padding:16px 18px;border-radius:10px;background:#14635F;color:#fff;text-decoration:none;font-weight:600;font-size:17px}
a.app small{display:block;font-weight:400;opacity:.85;font-size:13px}
a.chrome{display:block;margin:12px 0;padding:16px 18px;border-radius:10px;background:#A03E2E;color:#fff;text-decoration:none;font-weight:700;font-size:18px;text-align:center}
.box{background:#F2E0DB;color:#A03E2E;border-radius:8px;padding:12px 14px;font-size:14px;margin:0 0 10px}
p.note{font-size:13px;color:#6E7C78}</style></head><body><main>
<h1>校長選考 練習アプリ</h1>
<div id="inapp" hidden><div class="box"><b>LINE の中で開いています。</b>マイクを使うため、下のボタンで Chrome に切り替えてください。</div><a class="chrome" id="btnChrome" href="#">Chrome で開く</a></div>
<h2>口頭試問</h2>
<a class="app" href="qa.html?openExternalBrowser=1">一問一答 音声ドリル<small>51問。読み上げ → 声で答える → 合否を声で返す → 全問合格まで</small></a>
<a class="app" href="voice.html?openExternalBrowser=1">音声版<small>20問 ＋ 2問1セット×5。読み上げ → 話す → 100点採点</small></a>
<a class="app" href="text.html?openExternalBrowser=1">テキスト版<small>同じ内容を書いて答える</small></a>
<h2>論作文</h2>
<a class="app" href="essay.html?openExternalBrowser=1">論作文（13題）<small>問1 一問一答 → 問2 500〜600字 → 型で採点</small></a>
<p class="note">このページを Chrome の「ホーム画面に追加」にしておくと、次回から LINE を経由せずに開けます。</p>
</main>
<script>
(function(){
  var ua = navigator.userAgent || "";
  var inLine = /\bLine\//i.test(ua) || (/Android/i.test(ua) && /\bwv\b/.test(ua));
  if(!inLine) return;
  var u = location.href.replace(/^https?:\/\//, "").replace(/[?#].*$/, "");
  var intent = "intent://" + u + "#Intent;scheme=https;package=com.android.chrome;end";
  document.getElementById("inapp").hidden = false;
  document.getElementById("btnChrome").href = intent;
  setTimeout(function(){ location.href = intent; }, 800);
})();
</script>
</body></html>
