<style>

  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --paper:#10171A; --surface:#192226; --surface-2:#202B2F;
    --ink:#E4EAE7; --ink-2:#BCC8C5; --muted:#8B9B97; --line:#2E3C40;
    --accent:#6FC0B4; --accent-soft:#1E3436; --ochre:#D2A54A; --ochre-soft:#2E2718;

</style>

<script>// 生成物: make_qa.py が書き出す。直すときは make_qa.py を直す
window.KOTO_QA = {"title": "一問一答 音声ドリル（校長 口頭試問）", "source": "01_元資料/★ R7【校長】口頭試問.doc（阿見町合同研修会 模擬試験【校長】口頭試問（案））", "intro": "これから口頭試問を始めます。回答の持ち時間は、各質問につき1分以内です。わからない場合は、「わかりません」とお答えください。それでは、質問を始めます。", "note": "原本の Q10 は Q9 と同文（答えは Q8 のもの）のため除外。全51問。", "categories": ["学校教育指導方針", "法規・服務", "特別支援教育", "生徒指導・いじめ・安全", "県の施策・調査", "人材育成・教職員", "不祥事防止・個人情報", "学校徴収金"], "questions": [{"id": "qa-01", "no": 1, "category": "学校教育指導方針", "question": "令和7年度学校教育指導方針では、各教科と生徒指導を一体化させた授業づくり・集団づくりを進めるために、4つの視点を示しています。1つは「共感的な人間関係」、1つは「自己決定の場」ですが、残りの2つを答えなさい。", "answer": "「自己存在感の感受」「安心安全な風土の醸成」", "keys": [["自己存在感", "存在感"], ["安心安全", "安全安心", "安心", "風土"]], "need": 2, "reject": [], "tts": null, "note": null}, {"id": "qa-02", "no": 2, "category": "学校教育指導方針", "question": "令和7年度学校教育指導方針では、すべての子どもの可能性を引き出す活力ある学校づくりを目指して、「未来を拓く学びの展開」を掲げています。そこには4つの視点が示されていますが、そのうちの3つは「問いの発見と解決に重点を置く探究的な学びの充実」「ICTの効果的な活用」「よりよい社会の創造に貢献する市民性の育成」です。残りのもう1つを答えなさい。", "answer": "「個々の発達段階や教育的ニーズに応じた学びの充実」", "keys": [["発達段階", "教育的ニーズ", "ニーズに応じ", "個に応じ", "個々"]], "need": 1, "reject": [], "tts": null, "note": null}, {"id": "qa-03", "no": 3, "category": "法規・服務", "question": "「公立の義務教育諸学校等の教育職員の給与等に関する特別措置法等の一部を改正する法律」の成立にともない、今後、教職調整額が段階的に引き上げられることになりましたが、いつまでに、どのように引き上げられるか答えなさい。", "answer": "令和8年から毎年1%ずつ引き上げられ、令和13年に10%に引き上げられる", "keys": [["令和8", "8年から", "2026"], ["1%ずつ", "1%", "毎年1"], ["令和13", "13年", "2031"], ["10%"]], "need": 3, "reject": [], "tts": "令和8年から毎年1パーセントずつ引き上げられ、令和13年に10パーセントになる", "note": null}, {"id": "qa-04", "no": 4, "category": "法規・服務", "question": "令和7年4月1日より「職員の旅費及び費用弁償に関する条例」が一部改正され、「公務上必要な場合」に限り、タクシー代やレンタカー代等の実費支給が認められるようになりました。この「公務上必要な場合」として、どのようなことが想定されていますか。", "answer": "公共の交通機関がない、又は運行本数が著しく少なく、徒歩による移動が困難な場合 など", "keys": [["公共の交通機関", "公共交通機関", "交通機関", "運行本数", "本数が少な", "徒歩", "移動が困難"]], "need": 1, "reject": [], "tts": null, "note": null}, {"id": "qa-05", "no": 5, "category": "特別支援教育", "question": "自立活動の指導内容は6つの区分に分けて示されていますが、「健康の保持」「環境の把握」「身体の動き」、あと3つの区分を答えなさい。", "answer": "「心理的な安定」「人間関係の形成」「コミュニケーション」", "keys": [["心理的", "心理"], ["人間関係"], ["コミュニケーション"]], "need": 3, "reject": [], "tts": null, "note": null}, {"id": "qa-06", "no": 6, "category": "生徒指導・いじめ・安全", "question": "「いじめ防止対策推進法」に示された「重大事態」の定義を2つ答えなさい。", "answer": "①いじめにより当該学校に在籍する児童等の生命、心身又は財産に重大な被害が生じた疑いがあると認めるとき\n②いじめにより当該学校に在籍する児童等が相当の期間学校を欠席することを余儀なくされている疑いがあると認めるとき", "keys": [["生命", "心身", "財産", "重大な被害"], ["欠席", "相当の期間", "相当期間"]], "need": 2, "reject": [], "tts": null, "note": null}, {"id": "qa-07", "no": 7, "category": "学校教育指導方針", "question": "幼児教育と小学校教育の円滑な接続に向けて文部科学省が進めている、5歳児から1年生の2年間のカリキュラムの編成・実施や体制づくりのことを何というか。", "answer": "幼保小の「架け橋プログラム」", "keys": [["架け橋", "かけはし", "掛け橋", "懸け橋", "架橋"]], "need": 1, "reject": [], "tts": null, "note": "参考：学校教育指導方針 p.12"}, {"id": "qa-08", "no": 8, "category": "法規・服務", "question": "校長が、所属する教職員の服務について管理監督責任を負うことの法的根拠を説明しなさい。", "answer": "学校教育法第37条に「校長は、校務をつかさどり、所属職員を監督する」と規定されていること", "keys": [["学校教育法"], ["37条", "37"], ["校務をつかさど", "校務", "所属職員を監督", "監督する"]], "need": 2, "reject": [], "tts": "学校教育法第37条に、校長は校務をつかさどり、所属職員を監督する、と規定されていること", "note": null}, {"id": "qa-09", "no": 9, "category": "学校教育指導方針", "question": "令和7年度学校教育指導方針「巻頭のことば」において、柳橋教育長は、次世代を担う「人材」の育成を推進し、子どもたちとともに明るい未来を創るためには、何よりも何が大切だとしているか。", "answer": "教職員が活力に満ち、笑顔で子どもたちと接すること", "keys": [["活力"], ["笑顔"]], "need": 2, "reject": [], "tts": null, "note": null}, {"id": "qa-11", "no": 11, "category": "法規・服務", "question": "職員が不妊治療に係る通院等のため勤務しないことが相当であると認められる特別休暇の名称を何というか。また、1の年において何日を超えない範囲内で取得できるか。", "answer": "短期出生サポート休暇／10日を超えない範囲", "keys": [["出生サポート", "出産サポート", "サポート休暇"], ["10日"]], "need": 2, "reject": [], "tts": "短期出生サポート休暇、10日を超えない範囲", "note": null}, {"id": "qa-12", "no": 12, "category": "県の施策・調査", "question": "「第2次茨城県総合計画〜『新しい茨城』への挑戦」では、「次世代を担う『人財』の育成と自立を支える社会づくり」の指標として、「茨城県小中義務教育学校における不登校児童生徒が、学校内外の機関等での相談・指導等を受けている割合」が示されているが、この指標の2025年度の目標値は何%か。", "answer": "100%", "keys": [["100%", "100パーセント", "100"]], "need": 1, "reject": [], "tts": "100パーセント", "note": null}, {"id": "qa-13", "no": 13, "category": "県の施策・調査", "quest [], "tts": null, "note": null}, {"id": "qa-25", "no": 25, "category": "人材育成・教職員", "question": "令和5年2月に改訂された「茨城県公立の小学校等の校長及び教員の資質向上に関する指標」における、校長の項目6つを答えなさい。", "answer": "①学校経営　②学校管理　③教育計画　④人材育成及び服務監督　⑤連携・協力体制の構築　⑥職務遂行能力", "keys": [["学校経営"], ["学校管理"], ["教育計画"], ["人材育成", "服務監督"], ["連携", "協力体制"], ["職務遂行"]], "need": 5, "reject": [], "tts": null, "note": null}, {"id": "qa-26", "no": 26, "category": "特別支援教育", "question": "「適切な学びの場ガイドライン〜特別な教育的支援を必要とする児童生徒の学びの充実に向けて〜」（令和6年3月 茨城県教育委員会）では、校内委員会等における適切な学びの場の検討に至る段階的なプロセスが4つ示されている。そのうちの、プロセス4の項目内容を答えなさい。", "answer": "自立活動など特別の教育課程が編成できる、通級による指導や特別支援学級の必要性の検討", "keys": [["通級"], ["特別支援学級"], ["自立活動", "特別の教育課程"]], "need": 2, "reject": [], "tts": null, "note": null}, {"id": "qa-27", "no": 27, "category": "学校徴収金", "question": "「学校徴収金の取扱いに関するガイドライン〜市町村立学校における会計処理の適正化に向けて〜」（平成31年4月1日 茨城県教育委員会）では、「Ⅲ 学校徴収金に関する基本原則」として、学校が取り組む3つのことが示されている。3つ答えなさい。", "answer": "○学校徴収金の適正かつ効率的な執行を図る\n○公費に準じた適正な会計処理を行う\n○保護者に対して十分な説明責任を果たす", "keys": [["効率的", "執行"], ["公費"], ["説明責任"]], "need": 3, "reject": [], "tts": null, "note": null}, {"id": "qa-28", "no": 28, "category": "学校徴収金", "question": "「学校徴収金の適正な取扱い及び管理の徹底について」（令和6年9月30日 義教第1917号 通知）に示された、やむを得ず一時的に現金を保管する場合に作成するものは何か。また、執行状況の定期検査は年何回、いつを目安に行うか答えなさい。", "answer": "「現金保管記録簿」（管理職が金庫等で保管管理）／年3回、7月・12月・3月を目安に必ず行う", "keys": [["記録簿"], ["3回"], ["7月", "12月", "3月"]], "need": 3, "reject": [], "tts": "現金保管記録簿。定期検査は年3回、7月、12月、3月を目安に行う", "note": null}, {"id": "qa-29", "no": 29, "category": "生徒指導・いじめ・安全", "question": "「教育職員等による児童生徒性暴力等の防止等に関する法律」（令和3年6月）に示されている「児童生徒等への啓発・早期発見のための方策」を答えなさい。", "answer": "○何人からも児童生徒が性暴力等により自己の身体を侵害されることはあってはならないことを周知徹底する\n○教育職員等による児童生徒性暴力等があってはならないこと、及び被害を受けた児童生徒等に対して保護及び支援が行われること等について周知徹底する\n○定期的なアンケート調査や教育相談の実施、電話相談窓口の周知等により、児童生徒等が被害を訴えやすい体制を整えるとともに、地域、家庭と連携して児童生徒等を見守る", "keys": [["周知", "あってはならない"], ["アンケート", "教育相談", "電話相談", "相談窓口", "訴えやすい"], ["地域", "家庭", "見守"]], "need": 2, "reject": [], "tts": null, "note": null}, {"id": "qa-30", "no": 30, "category": "法規・服務", "question": "令和7年9月、 際の留意点として示されていること2つを答えなさい。", "answer": "①個人情報については、必要に応じて電子データで確認する方法を用いるなど、原則、紙媒体で個人情報を校外へ持ち出さないこと\n②個人情報を電子データで確認する方法を用いる場合は、市町村の情報セキュリティポリシーに則って、共有ドライブを使用するなど、リスクが最小限となるよう工夫すること", "keys": [["紙媒体", "紙", "持ち出さ"], ["セキュリティポリシー", "共有ドライブ", "リスク"]], "need": 2, "reject": [], "tts": null, "note": null}, {"id": "qa-47", "no": 47, "category": "県の施策・調査", "question": "「令和7年度 義務教育課等主要施策等の概要」（令和7年7月29日）に示された、経験豊富で力量のある再任用教員を拠点校に配置し、重大な問題や欠員等の不測の事態が生じた学校を兼務発令によりサポートすることで、問題の早期解決や未補充の解消を図ることを目的として、令和8年4月から配置される加配の名称を答えなさい。また、その配置期間を答えなさい。", "answer": "名称：再任用学校運営サポーター\n期間：問題が一定の収束を迎えるまで・補充が配置されるまで", "keys": [["サポーター"], ["収束", "補充"]], "need": 2, "reject": [], "tts": null, "note": null}, {"id": "qa-48", "no": 48, "category": "法規・服務", "question": "「職員の育児休業等に関する条例等の一部改正について」（令和7年6月30日 教総第490号 通知）で、部分休業制度はどのように改正されたかを答えなさい。", "answer": "○1日につき2時間を超えない範囲で取得できる部分休業を「第1部分休業」とし、1年につき条例で定める時間を超えない範囲で取得できる「第2部分休業」が新設（第2は1年に77時間30分、1時間単位）\n○取得できる時間は「制限なし」（勤務時間の始め又は終わりから、に変更）", "keys": [["第2部分休業", "第2", "新設"], ["2時間", "77時間", "制限なし", "制限無し", "1時間単位"]], "need": 2, "reject": [], "tts": null, "note": null}, {"id": "qa-49", "no": 49, "category": "法規・服務", "question": "学校における教師による性暴力の根絶は喫緊の課題ですが、その根拠となる法令を答えなさい。", "answer": "教育職員等による児童生徒性暴力等の防止等に関する法律", "keys": [["性暴力"]], "need": 1, "reject": [], "tts": null, "note": null}, {"id": "qa-50", "no": 50, "category": "法規・服務", "question": "「いじめの未然防止」を進めていくにあたり、根拠となる法令を2つ答えなさい。", "answer": "いじめ防止対策推進法／茨城県いじめの根絶を目指す条例／茨城県いじめ防止基本方針", "keys": [["防止対策推進法", "推進法"], ["根絶を目指す条例", "根絶", "条例"], ["基本方針"]], "need": 2, "reject": [], "tts": null, "note": null}, {"id": "qa-51", "no": 51, "category": "法規・服務", "question": "時間外在校等時間が特に長時間となっている教職員に対して、校長として、どのような法令や指針に基づき、どのように指導するかを答えなさい。", "answer": "公立の義務教育諸学校等の教育職員の給与等に関する特別措置法（給特法）／公立学校の教師の勤務時間の上限に関するガイドライン（文部科学省）", "keys": [["給特法", "特別措置法"], ["ガイドライン", "上限"]], "need": 2, "reject": [], "tts": null, "note": null}, {"id": "qa-52", "no": 52, "category": "生徒指導・いじめ・安全", "question": "体罰の防止は喫緊の課題となっています。「教職員の不祥事根絶に向けた教育長メッセー <script>// 一問一答の合否判定（ローカル・キーワード方式）
// window.KotoQA.judge(q, text) → { pass, hits:[語群index], missing:[語群index], rejected:[語], said:[代表語], lack:[代表語], text }
// 正規化: NFKC → 小文字 → 空白・句読点除去 → 漢数字→算用数字（「三年」→「3年」「九十日」→「90日」）
(function(){
  const KD = {"〇":0,"零":0,"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
  function kanjiNum(s){
    // 一〜九千九百九十九までの素朴な変換。「十」「百」「千」を含む並びと単独の数字漢字を変換する
    return s.replace(/[〇零一二三四五六七八九十百千]+/g, m => {
      if(m === "十") return "10";
      let total = 0, cur = 0, hasUnit = false;
      for(const ch of m){
        if(ch === "十"){ total += (cur||1)*10; cur = 0; hasUnit = true; }
        else if(ch === "百"){ total += (cur||1)*100; cur = 0; hasUnit = true; }
        else if(ch === "千"){ total += (cur||1)*1000; cur = 0; hasUnit = true; }
        else cur = cur*10 + KD[ch];
      }
      total += cur;
      // 回答側と正答側を同じ規則で正規化するので、「一人一人」→「1人1人」のような変換も問題ない
      return String(total);
    });
  }
  function norm(s){
    s = String(s||"").normalize("NFKC").toLowerCase();
    s = s.replace(/パーセント|ぱーせんと|％/g, "%");
    s = s.replace(/キロメートル|きろめーとる|キロ/g, "km");
    s = s.replace(/[\s　、。・，．,.「」『』（）()［］\[\]【】〈〉《》〔〕"'’“”:：;；!！?？~〜ー\-–—／/]/g, "");
    s = kanjiNum(s);
    return s;
  }
  function judge(q, text){
    const t = norm(text);
    const hits = [], missing = [], said = [], lack = [];
    q.keys.forEach((grp, i) => {
      const hit = grp.some(k => { const nk = norm(k); return nk && t.indexOf(nk) >= 0; });
      if(hit){ hits.push(i); said.push(grp[0]); } else { missing.push(i); lack.push(grp[0]); }
    });
    const rejected = (q.reject||[]).filter(r => t.indexOf(norm(r)) >= 0 && !q.keys.some(g => g.some(k => norm(k).indexOf(norm(r))>=0)));
    const need = q.need || q.keys.length;
    const pass = hits.length >= need && rejected.length === 0;
    return { pass, hits, missing, rejected, said, lack, need, total: q.keys.length, text };
  }
  // 「次へ／やめる／もう一度」の聞き取り
  function intent(text){
    const t = norm(text);
    if(!t) return null;
    if(/やめ|止め|終了|しゅうりょう|ストップ|すとっぷ|おわり|終わり|いいえ|いや|休憩|きゅうけい|中止/.test(t)) return "stop";
    if(/もう1度|もういちど|もう1回|もういっかい|繰り返|くりかえ|再度|もっかい/.test(t)) return "again";
    if(/はい|ハイ|次|つぎ|進|すすむ|お願い|おねがい|オッケー|おっけー|ok|いいよ|行く|いく|どうぞ|続け|つづけ|ゴー|go/.test(t)) return "next";
    return null;
  }
  window.KotoQA = { norm, judge, intent, kanjiNum };
})();
</script>
<script>
(function(){
  const D = window.KOTO_QA, QS = D.questions, K = window.KotoQA;
  const STORE = "koto_qa_v1";
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const synth = window.speechSynthesis;
  // 出題間隔（この問題数だけ他の問題をはさんでから再出題）
  const GAP_AGAIN = 4;     // 不合格 → 4問後にもう一度
  const GAP_CONFIRM = 12;  // 不合格だった問題が合格 → 12問後に確認（忘れた頃）
  let state = load(), prefs = loadPrefs();
  let running = false, cur = null, phase = "idle", rec = null, fallbackMode = !SR, forcedId = null;
  let session = { asked:0, ok:0, ng:0 };
  let finalText = "", interimText = "";

  function load(){ try{ return JSON.parse(localStorage.getItem(STORE)||"{}"); }catch(e){ return {}; } }
  function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }
  function loadPrefs(){ try{ return JSON.parse(localStorage.getItem(STORE+"_prefs")||"{}"); }catch(e){ return {}; } }
  function savePrefs(){ try{ localStorage.setItem(STORE+"_prefs", JSON.stringify(prefs)); }catch(e){} }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
  function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }
  function $(id){ return document.getElementById(id); }
  function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
  function recOf(id){ return state[id] || (state[id] = {st:"new", due:0, tries:0, ok:0, ng:0}); }
  function tick(){ return state._tick || 0; }

  // ─ 読み上げ（TTS）: 女性／男性の自然な声を選ぶ ─
  const NOVELTY = /Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Bells|Bubbles|Bad News|Boing|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Albert|Fred|Junior|Kathy|Ralph/i;
  const RANK = {
    female: [/Kyoko.*(Premium|プレミアム)/i, /premium.*Kyoko/i, /Kyoko.*(Enhanced|拡張)/i, /enhanced.*Kyoko/i, /Nanami.*Natural/i, /Google 日本語/i, /Nanami/i, /Kyoko/i, /O-Ren/i, /Ayumi/i, /Haruka/i],
    male:   [/Otoya.*(Premium|プレミアム)/i, /premium.*Otoya/i, /Otoya.*(Enhanced|拡張)/i, /enhanced.*Otoya/i, /Keita.*Natural/i, /Keita/i, /Otoya/i, /Ichiro/i, /Hattori/i],
  };
  let voices = [];
  function refreshVoices(){ voices = synth ? synth.getVoices().filter(v => /^ja/i.test(v.lang) && !NOVELTY.test(v.name)) : []; updateVoiceName(); }
  function findVoice(g){ for(const re of RANK[g]){ const v = voices.find(v => re.test(v.name) || re.test(v.voiceURI||"")); if(v) return v; } return null; }
  function pickVoice(){ const g = prefs.gender||"female"; return findVoice(g) || findVoice(g==="female"?"male":"female") || voices[0] || null; }
  function updateVoiceName(){
    const n = $("vname"); if(!n) return;
    const g = prefs.gender||"female", v = findVoice(g);
    if(!voices.length){ n.textContent = "（日本語の声が見つかりません）"; return; }
    n.textContent = v ? "使用中: " + v.name : (g==="male" ? "男性の声が未インストールのため女性の声で読みます" : "女性の声が見つからないため別の声で読みます");
  }
  if(synth){ refreshVoices(); synth.onvoiceschanged = refreshVoices; }
  let speakToken = 0;
  function speak(text, opts){
    opts = opts||{};
    return new Promise(resolve => {
      if(!synth || !text){ resolve(); return; }
      synth.cancel();
      const my = ++speakToken;
      const chunks = String(text).replace(/\n+/g,"。").split(/(?<=[。？！])/).map(s=>s.trim()).filter(Boolean);
      if(!chunks.length){ resolve(); return; }
      const v = pickVoice(), rate = parseFloat(prefs.rate||"0.95");
      const male = v && RANK.male.some(re => re.test(v.name) || re.test(v.voiceURI||""));
      let i = 0, done = false;
      const finish = () => { if(!done){ done=true; resolve(); } };
      const next = () => {
        if(my !== speakToken){ finish(); return; }
        if(i >= chunks.length){ finish(); return; }
        const u = new SpeechSynthesisUtterance(chunks[i++]);
        u.lang="ja-JP"; if(v) u.voice=v; u.rate=rate; u.pitch = male?0.95:1.0;
        u.onend = () => setTimeout(next, opts.pause!=null?opts.pause:300);
        u.onerror = next;
        synth.speak(u);
      };
      next();
      setTimeout(finish, String(text).length*320/rate + 4000);
    });
  }
  function stopSpeak(){ speakToken++; if(synth) synth.cancel(); }

  // ─ 聞き取り: 話し終えて少し黙ると自動で終わる ─
  function listen(opt){
    opt = opt||{};
    return new Promise(resolve => {
      if(!SR || fallbackMode){ resolve(null); return; }
      let text = "", interim = "", ended = false, silence = null, hard = null;
      const end = () => { if(ended) return; ended = true; clearTimeout(silence); clearTimeout(hard); try{ r.onend=null; r.stop(); }catch(e){} rec=null; resolve((text + interim).trim()); };
      const r = new SR(); rec = r;
      r.lang="ja-JP"; r.continuous=true; r.interimResults=true; r.maxAlternatives=1;
      r.onresult = e => {
        interim = "";
        for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) text += t; else interim += t; }
        if(opt.onText) opt.onText(text, interim);
        clearTimeout(silence); silence = setTimeout(end, opt.silenceMs||2600);
      };
      r.onerror = e => {
        if(e.error==="not-allowed" || e.error==="service-not-allowed"){ fallbackMode=true; toast("マイクが許可されていません。入力に切り替えます"); ended=true; clearTimeout(silence); clearTimeout(hard); rec=null; resolve(null); return; }
        if(e.error==="no-speech"){ end(); return; }
        if(e.error==="network"){ toast("音声認識サービスに接続できません（ネット接続を確認）"); }
      };
      r.onend = () => { if(!ended){ if(text||interim) end(); else { try{ r.start(); }catch(err){ end(); } } } };
      try{ r.start(); }catch(err){ fallbackMode=true; resolve(null); return; }
      hard = setTimeout(end, opt.maxMs||60000);
      if(opt.noSpeechMs) silence = setTimeout(() => { if(!text && !interim) end(); }, opt.noSpeechMs);
      listen.stopNow = end;
    });
  }
  function stopListen(){ if(listen.stopNow) listen.stopNow(); }

  // ─ 出題順（プログラム学習）─
  // new: 未出題 / learn: 不合格で再出題待ち / review: 合格したが忘れた頃に確認 / done: 合格確定
  function pickNext(){
    if(forcedId){ const q = QS.find(x=>x.id===forcedId); forcedId=null; if(q) return q; }
    const t = tick();
    const pending = QS.filter(q => recOf(q.id).st!=="done");
    if(!pending.length) return null;
    const due = pending.filter(q => recOf(q.id).st!=="new" && recOf(q.id).due <= t).sort((a,b)=>recOf(a.id).due-recOf(b.id).due);
    if(due.length) return due[0];
    const fresh = pending.filter(q => recOf(q.id).st==="new");
    if(fresh.length) return fresh[0];
    return pending.sort((a,b)=>recOf(a.id).due-recOf(b.id).due)[0];
  }
  let prevRec = null; // 再判定で取り消せるよう、記録前の状態を控える
  function record(q, pass, redo){
    const r = recOf(q.id);
    if(redo && prevRec && prevRec.id===q.id) Object.assign(r, prevRec.r); else prevRec = { id:q.id, r: JSON.parse(JSON.stringify(r)) };
    const t = redo ? tick() : (state._tick = tick()+1);
    r.tries++; r.last = Date.now(); r.lastPass = pass;
    if(pass){ r.ok++; r.st = (r.st==="new"||r.st==="review") ? "done" : "review"; r.due = t + GAP_CONFIRM; }
    else { r.ng++; r.st = "learn"; r.due = t + GAP_AGAIN; }
    save();
  }
  function counts(){
    const c = {done:0, review:0, learn:0, new:0};
    QS.forEach(q => c[recOf(q.id).st]++);
    return c;
  }

  // ─ 一覧 ─
  const STL = {done:"合格", review:"確認待ち", learn:"再出題", new:""};
  function renderList(){
    const c = counts(), n = QS.length;
    let h = '<h2>進み具合</h2><div class="prog"><b>'+c.done+'</b> / '+n+' 問 合格　<span style="color:var(--ochre)">確認待ち '+c.review+'</span>　<span style="color:var(--ng)">再出題 '+c.learn+'</span>　未出題 '+c.new+
      '<div class="trk"><i class="d" style="width:'+(c.done/n*100)+'%"></i><i class="r" style="width:'+(c.review/n*100)+'%"></i><i class="l" style="width:'+(c.learn/n*100)+'%"></i></div></div>';
    h += '<h2>問題一覧（押すと次にその問題を出します）</h2>';
    for(const cat of D.categories){
      h += '<div class="cat">'+esc(cat)+'</div>';
      for(const q of QS.filter(x=>x.category===cat)){
        const r = recOf(q.id);
        h += '<button class="qbtn'+(cur&&cur.id===q.id?' active':'')+'" data-id="'+q.id+'"><span class="no">'+q.no+'</span><span class="t">'+esc(q.question.slice(0,40))+'</span>'+(STL[r.st]?'<span class="st '+r.st+'">'+STL[r.st]+(r.ng?' ×'+r.ng:'')+'</span>':'')+'</button>';
      }
    }
    $("list").innerHTML = h;
    $("list").querySelectorAll(".qbtn").forEach(b => b.addEventListener("click", () => { forcedId = b.dataset.id; if(running && phase==="wait") goNext(); else if(!running) startSession(); else toast("この問題の後に出します"); }));
  }

  // ─ 開始画面 ─
  function renderHome(){
    const c = counts();
    $("stage").innerHTML = `
      <section class="card">
        <div class="eyebrow"><span class="pill">${QS.length}問</span><span>${esc(D.source)}</span></div>
        <p class="empty">${c.done===QS.length ? "全問合格です。「記録を消す」で最初からやり直せます。" : c.done+c.review+c.learn>0 ? "前回の続きから始めます（合格 "+c.done+" ／ 残り "+(QS.length-c.done)+"）。" : "問題を読み上げます。声で答えると、合格か不合格かを声でお伝えし、次に進むかどうかをお聞きします。"}</p>
        <ol class="how">
          <li>「開始」を押す（初回はマイクの許可が出ます）。あとは手を使わず声だけで進められます。</li>
          <li>読み上げのあと、答えを話す。2〜3秒黙ると自動で答え終わりになります。</li>
          <li>合格／不合格を声で返します。不合格なら正解を読み上げます。</li>
          <li>「次の問題に進みますか」と聞くので、<b>「はい」</b>／<b>「やめる」</b>／<b>「もう一度」</b>と答える。</li>
          <li>不合格の問題は ${GAP_AGAIN} 問後にもう一度、そこで合格しても ${GAP_CONFIRM} 問後に確認します。全問が合格になるまで続きます。</li>
        </ol>
        <div class="actions"><button class="btn primary big" id="btnBegin">${c.done+c.review+c.learn>0?"続きから開始":"開始"}</button><button class="btn" id="btnTestVoice">声を試す</button></div>
        <div class="settings">
          <label>質問役の声 <select id="voiceSel"><option value="female">女性</option><option value="male">男性</option></select></label><span class="vname" id="vname"></span>
          <label>速さ <select id="rateSel"><option value="0.85">ゆっくり</option><option value="0.95">ふつう</option><option value="1.05">速め</option></select></label>
          <label><input type="checkbox" id="twice"> 質問を2回読む（本番と同じ）</label>
          <label><input type="checkbox" id="autoNext"> 聞かずに自動で次へ</label>
          <label><input type="checkbox" id="hideQ"> 問題文を隠す（聞き取り練習）</label>
        </div>
        <p class="vhelp" id="vhelp"></p>
        <p class="note" id="support"></p>
        <p class="src">${esc(D.note)}</p>
      </section>`;
    bindSettings();
    $("btnBegin").addEventListener("click", startSession);
    $("btnTestVoice").addEventListener("click", () => speak("それでは、質問を始めます。落ち着いてお答えください。"));
    showSupport(); renderList();
  }
  function bindSettings(){
    refreshVoices();
    const vs=$("voiceSel"), rs=$("rateSel"), tw=$("twice"), an=$("autoNext"), hq=$("hideQ");
    if(vs){ vs.value=prefs.gender||"female"; vs.addEventListener("change", e => { prefs.gender=e.target.value; savePrefs(); updateVoiceName(); }); }
    if(rs){ rs.value=prefs.rate||"0.95"; rs.addEventListener("change", e => { prefs.rate=e.target.value; savePrefs(); }); }
    if(tw){ tw.checked=!!prefs.twice; tw.addEventListener("change", e => { prefs.twice=e.target.checked; savePrefs(); }); }
    if(an){ an.checked=!!prefs.autoNext; an.addEventListener("change", e => { prefs.autoNext=e.target.checked; savePrefs(); }); }
    if(hq){ hq.checked=!!prefs.hideQ; hq.addEventListener("change", e => { prefs.hideQ=e.target.checked; savePrefs(); const q=$("qtext"); if(q) q.classList.toggle("hidden-q", e.target.checked && phase!=="result"); }); }
    const help = $("vhelp"); if(help){
      const isMac = /Mac/i.test(navigator.platform||"") || /Macintosh/i.test(navigator.userAgent);
      help.innerHTML = isMac ? "より自然な声にするには、Mac の<b>システム設定 › アクセシビリティ › 読み上げコンテンツ › システムの声 › 管理</b>で日本語の <b>Kyoko（プレミアム）</b>と <b>Otoya（プレミアム）</b>をダウンロードしてください。" : "Android は Google の日本語音声、Windows は Edge（Nanami／Keita）が自然に読みます。";
    }
  }
  function showSupport(){
    const s=$("support"); if(!s) return;
    if(!SR) s.innerHTML = "このブラウザは音声認識に対応していません（Firefox・LINE内ブラウザなど）。回答は<b>キーボード入力</b>になります。Chrome・Safari を推奨します。";
    else if(!synth) s.textContent = "読み上げ機能が使えないため、問題文は画面で読んでください。";
    else s.textContent = "";
  }
  (function detectInApp(){
    const ua = navigator.userAgent||"";
    const isLine = /\bLine\//i.test(ua), isAndroidWV = /Android/i.test(ua) && (/\bwv\b/.test(ua)||isLine), isIOSInApp = /iPhone|iPad/i.test(ua) && !/Safari\//i.test(ua);
    if(!(isLine||isAndroidWV||isIOSInApp)) return;
    const box=$("inapp"); let h = "<span><b>このままではマイクが使えません。</b>";
    if(/Android/i.test(ua)){ h += " 右上の「︙」→「他のアプリで開く」→ <b>Chrome</b> を選んでください。</span>"; if(/^https?:/.test(location.href)) h += '<a class="btn" href="intent://'+location.href.replace(/^https?:\/\//,"")+'#Intent;scheme=https;package=com.android.chrome;end">Chromeで開く</a>'; }
    else h += " 右下の共有ボタン →「<b>Safariで開く</b>」を選んでください。</span>";
    box.innerHTML=h; box.hidden=false;
  })();

  // ─ セッション ─
  async function startSession(){
    if(running) return;
    running = true; session = {asked:0, ok:0, ng:0};
    const c = counts();
    if(c.done===QS.length){ running=false; toast("全問合格済みです。「記録を消す」で最初から"); return; }
    if(c.done+c.review+c.learn===0 && !forcedId) await speak(D.intro);
    goNext();
  }
  async function goNext(){
    if(!running) return;
    const q = pickNext();
    if(!q){ finishAll(); return; }
    cur = q; phase = "read"; finalText=""; interimText="";
    renderQuestion();
    renderList();
    const r = recOf(q.id);
    const lead = r.st==="learn" ? "もう一度お聞きします。" : r.st==="review" ? "確認です。" : "";
    const qtext = q.question;
    await speak(lead + "第" + q.no + "問。" + qtext + (prefs.twice ? " 繰り返します。" + qtext : "") + " どうぞ。", {});
    if(!running || cur!==q) return;
    await answerPhase();
  }
  function renderQuestion(){
    const q = cur, r = recOf(q.id);
    $("stage").innerHTML = `
      <section class="card" id="qcard">
        <div class="eyebrow"><span class="pill">第${q.no}問</span><span>${esc(q.category)}</span>${r.tries?'<span>'+(r.st==="learn"?"再出題":"確認")+'（これまで ○'+r.ok+' ×'+r.ng+'）</span>':''}<span style="margin-left:auto">今回 ${session.asked}問 ○${session.ok} ×${session.ng}</span></div>
        <p class="qtext ${prefs.hideQ?'hidden-q':''}" id="qtext">${esc(q.question)}</p>
        <div class="console">
          <span class="status" id="status"><b>読み上げています。</b></span>
          <span class="ctrls">
            <button class="btn" id="btnReread">聞き直す</button>
            <button class="btn primary" id="btnDone" hidden>答え終わり</button>
            <button class="btn danger" id="btnQuit">やめる</button>
          </span>
        </div>
        <div class="tr" id="trwrap" hidden><div class="lbl">あなたの答え（文字起こし）</div><div class="trbox" id="trbox"></div></div>
        <div id="result"></div>
      </section>`;
    $("btnReread").addEventListener("click", async () => { stopListen(); phase="read"; setStatus("<b>もう一度読み上げます。</b>"); await speak("第"+q.no+"問。"+q.question+" どうぞ。"); if(cur===q && running) answerPhase(); });
    $("btnDone").addEventListener("click", () => { if(fallbackMode){ submitFallback(); } else stopListen(); });
    $("btnQuit").addEventListener("click", () => stopSession(true));
  }
  function setStatus(h){ const s=$("status"); if(s) s.innerHTML=h; }
  async function answerPhase(){
    const q = cur; phase = "answer";
    $("trwrap").hidden = false; $("btnDone").hidden = false;
    if(fallbackMode){
      $("trbox").outerHTML = '<textarea id="trbox" placeholder="ここに答えを入力して「答え終わり」（Enter）"></textarea>';
      $("trbox").addEventListener("keydown", e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); submitFallback(); } });
      $("trbox").focus();
      setStatus("<b>答えを入力してください。</b>");
      return;
    }
    setStatus('<span class="dot"></span><b>どうぞ。</b>答え終わって2〜3秒黙ると、自動で判定します。');
    const text = await listen({ silenceMs: 2800, maxMs: 70000, noSpeechMs: 15000, onText: (t,i) => { const b=$("trbox"); if(b&&b.tagName!=="TEXTAREA") b.innerHTML = esc(t)+'<span class="interim">'+esc(i)+'</span>'; } });
    if(!running || cur!==q || phase!=="answer") return;
    if(text===null){ answerPhase(); return; } // マイク不可 → 入力に切替
    await judgeAndTell(q, text);
  }
  function submitFallback(){ const b=$("trbox"); if(!b) return; const t=(b.value||"").trim(); if(!t){ toast("答えを入力してください"); return; } judgeAndTell(cur, t); }
  async function judgeAndTell(q, text){
    phase = "result"; $("btnDone").hidden = true;
    const b=$("trbox"); if(b && b.tagName!=="TEXTAREA") b.textContent = text;
    const res = K.judge(q, text);
    record(q, res.pass); session.asked++; if(res.pass) session.ok++; else session.ng++;
    renderResult(q, res, text); renderList();
    $("qtext").classList.remove("hidden-q");
    let say;
    if(res.pass){
      say = "合格です。";
      if(res.missing.length && res.lack.length) say += " さらに、" + res.lack.join("、") + "、も言えるとよいでしょう。";
    } else if(res.rejected.length){
      say = "不合格です。" + res.rejected.join("、") + "、は含まれません。正解は、" + (q.tts||q.answer) + "。";
    } else if(res.hits.length){
      say = "惜しい、不合格です。" + res.said.join("、") + "、は言えました。" + res.lack.join("、") + "、が抜けています。正解は、" + (q.tts||q.answer) + "。";
    } else {
      say = "不合格です。正解は、" + (q.tts||q.answer) + "。";
    }
    await speak(say.replace(/[①②③④⑤⑥○※]/g,"").replace(/\n+/g,"。"));
    if(!running || cur!==q) return;
    const c = counts();
    if(c.done===QS.length){ finishAll(); return; }
    if(prefs.autoNext){ await sleep(900); if(running && cur===q) goNext(); return; }
    await askContinue(q);
  }
  async function askContinue(q, second){
    phase = "wait";
    setStatus('<span class="dot"></span><b>次の問題に進みますか？</b>「はい」「やめる」「もう一度」で答えてください（ボタンでも可）。');
    await speak(second ? "聞き取れませんでした。次に進みますか。はい、か、やめる、で答えてください。" : "次の問題に進みますか。はい、か、やめる、で答えてください。");
    if(!running || cur!==q || phase!=="wait") return;
    if(fallbackMode) return; // ボタンで操作
    const t = await listen({ silenceMs: 1500, maxMs: 10000, noSpeechMs: 7000 });
    if(!running || cur!==q || phase!=="wait") return;
    const it = K.intent(t||"");
    if(it==="next") goNext();
    else if(it==="stop") stopSession(true);
    else if(it==="again") { forcedId = q.id; goNext(); }
    else if(!second) askContinue(q, true);
    else setStatus("<b>ボタンで選んでください。</b>");
  }
  function renderResult(q, res, text){
    const chips = q.keys.map((g,i) => '<span class="chip '+(res.hits.includes(i)?'ok':'ng')+'">'+(res.hits.includes(i)?'✓ ':'× ')+esc(g[0])+'</span>').join("");
    $("result").innerHTML = `
      <div class="verdict"><span class="big ${res.pass?'ok':'ng'}">${res.pass?'合格':'不合格'}</span><span class="sub">${res.hits.length} / ${res.total} の要素（合格ライン ${res.need}）${res.rejected.length?'　余計な語: '+esc(res.rejected.join("、")):''}</span></div>
      <div class="chips">${chips}</div>
      <h3>正解 <button class="btn ghost" id="btnReadAns" style="padding:2px 8px;font-size:12px">▶ 読み上げ</button></h3>
      <div class="model">${esc(q.answer)}</div>${q.note?'<p class="note">'+esc(q.note)+'</p>':''}
      <h3 style="margin-top:14px">聞き取りの誤りを直す <span class="tag">直して「再判定」すると記録も更新</span></h3>
      <textarea id="editTr">${esc(text)}</textarea>
      <div class="actions">
        <button class="btn" id="btnRejudge">再判定</button>
        <button class="btn" id="btnAgain">この問題をもう一度</button>
        <button class="btn primary" id="btnNext">次の問題へ</button>
        <button class="btn danger" id="btnStop">ここでやめる</button>
      </div>`;
    $("btnReadAns").addEventListener("click", () => { stopListen(); speak(q.tts||q.answer); });
    $("btnRejudge").addEventListener("click", () => {
      stopListen(); stopSpeak();
      const t = $("editTr").value.trim(); const r2 = K.judge(q, t);
      // 直前の記録を取り消して付け直す
      if(res.pass) session.ok--; else session.ng--;
      record(q, r2.pass, true);
      if(r2.pass) session.ok++; else session.ng++;
      renderResult(q, r2, t); renderList(); phase="wait";
      setStatus("<b>再判定しました。</b>「次の問題へ」で進みます。");
    });
    $("btnAgain").addEventListener("click", () => { stopListen(); stopSpeak(); forcedId=q.id; goNext(); });
    $("btnNext").addEventListener("click", () => { stopListen(); stopSpeak(); goNext(); });
    $("btnStop").addEventListener("click", () => stopSession(true));
  }
  async function stopSession(announce){
    running = false; phase="idle"; stopListen(); stopSpeak(); cur=null;
    const c = counts();
    $("stage").innerHTML = `
      <section class="card">
        <h3 style="margin-top:0">ここまでの結果</h3>
        <div class="summary"><div><b>${session.asked}</b><span>今回の出題</span></div><div><b style="color:var(--ok)">${session.ok}</b><span>合格</span></div><div><b style="color:var(--ng)">${session.ng}</b><span>不合格</span></div><div><b>${c.done} / ${QS.length}</b><span>合格確定</span></div></div>
        <p class="note">記録は端末に保存されます。次回「続きから開始」で、再出題待ちの問題から再開します。</p>
        <div class="actions"><button class="btn primary big" id="btnResume">続きから開始</button><button class="btn" id="btnHome">最初の画面へ</button></div>
      </section>`;
    $("btnResume").addEventListener("click", startSession);
    $("btnHome").addEventListener("click", renderHome);
    renderList();
    if(announce) await speak("ここまでにします。今回は" + session.asked + "問中、" + session.ok + "問合格でした。お疲れさまでした。");
  }
  async function finishAll(){
    running=false; phase="idle"; stopListen(); cur=null;
    $("stage").innerHTML = `<section class="card"><h3 style="margin-top:0">全問合格</h3><p class="empty">${QS.length}問すべてが合格になりました。お疲れさまでした。</p><div class="actions"><button class="btn primary" id="btnHome">最初の画面へ</button></div></section>`;
    $("btnHome").addEventListener("click", renderHome); renderList();
    await speak("全問合格です。" + QS.length + "問すべてに合格しました。お疲れさまでした。");
  }

  $("btnReset").addEventListener("click", () => {
    const b=$("btnReset");
    if(b.dataset.arm){ stopListen(); stopSpeak(); running=false; state={}; save(); delete b.dataset.arm; b.textContent="記録を消す"; toast("記録を消しました"); renderHome(); }
    else { b.dataset.arm="1"; b.textContent="もう一度押すと消えます"; setTimeout(()=>{ delete b.dataset.arm; b.textContent="記録を消す"; },3000); }
  });
  renderHome();
})();
</script>
</body>
</html>
