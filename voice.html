<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>校長口頭試問 音声版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#E7E9E3; --surface:#FCFCFA; --surface-2:#F1F3ED;
    --ink:#18262A; --ink-2:#3C4C4E; --muted:#6E7C78; --line:#CFD5CD;
    --accent:#14635F; --accent-soft:#DCE8E5; --ochre:#9A6E16; --ochre-soft:#F3EBD8;
    --ok:#1F6B4C; --ok-soft:#DDEBE2; --ng:#A03E2E; --ng-soft:#F2E0DB;
    --rec:#B5392A;
    --shadow:0 1px 2px rgba(24,38,42,.06), 0 8px 24px -16px rgba(24,38,42,.35);
    --mincho:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    --gothic:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --paper:#10171A; --surface:#192226; --surface-2:#202B2F;
      --ink:#E4EAE7; --ink-2:#BCC8C5; --muted:#8B9B97; --line:#2E3C40;
      --accent:#6FC0B4; --accent-soft:#1E3436; --ochre:#D2A54A; --ochre-soft:#2E2718;
      --ok:#7FC79E; --ok-soft:#1B2E26; --ng:#E2897A; --ng-soft:#33211E; --rec:#E8705F;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --paper:#10171A; --surface:#192226; --surface-2:#202B2F;
    --ink:#E4EAE7; --ink-2:#BCC8C5; --muted:#8B9B97; --line:#2E3C40;
    --accent:#6FC0B4; --accent-soft:#1E3436; --ochre:#D2A54A; --ochre-soft:#2E2718;
    --ok:#7FC79E; --ok-soft:#1B2E26; --ng:#E2897A; --ng-soft:#33211E; --rec:#E8705F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.9);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:15px;line-height:1.75}
  body{padding-block:0 40px}
  button{font:inherit;cursor:pointer}
  .top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .top h1{font-family:var(--mincho);font-size:18px;margin:0;font-weight:600;letter-spacing:.04em}
  .top .sub{color:var(--muted);font-size:12px}
  .top .spacer{flex:1}
  .btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 14px;font-size:14px;transition:background .15s}
  .btn:hover{background:var(--surface-2)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.danger{background:var(--rec);border-color:var(--rec);color:#fff;font-weight:600}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px;display:grid;grid-template-columns:300px 1fr;gap:18px}
  @media (max-width:860px){.wrap{grid-template-columns:1fr}}
  .list{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;align-self:start;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
  @media (max-width:860px){.list{position:static;max-height:none}}
  .list h2{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500;margin:8px 8px 4px}
  .cat{font-family:var(--mincho);font-size:13px;color:var(--ink-2);margin:12px 8px 4px;border-left:3px solid var(--accent);padding-left:8px}
  .qbtn{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:6px 8px;border-radius:6px;font-size:13.5px;line-height:1.4}
  .qbtn:hover{background:var(--surface-2)}
  .qbtn.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .qbtn .no{font-family:var(--mincho);color:var(--muted);min-width:1.6em;font-variant-numeric:tabular-nums}
  .qbtn .sc{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .qbtn .sc.A{color:var(--ok)} .qbtn .sc.B{color:var(--accent)} .qbtn .sc.C{color:var(--ochre)} .qbtn .sc.D{color:var(--ng)}
  .stage{min-width:0}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:16px}
  @media (max-width:600px){.card{padding:16px}}
  .eyebrow{font-size:12px;color:var(--muted);letter-spacing:.08em;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .eyebrow .pill{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:1px 10px;letter-spacing:0}
  .qtext{font-family:var(--mincho);font-size:20px;line-height:1.8;margin:10px 0 6px;text-wrap:balance}
  .qtext.hidden-q{filter:blur(6px);user-select:none}
  @media (max-width:600px){.qtext{font-size:18px}}
  .steps{display:flex;gap:6px;margin:8px 0 0;flex-wrap:wrap}
  .step{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .step.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .step.done{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
  .console{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--surface-2)}
  @media (max-width:600px){.console{grid-template-columns:1fr;text-align:center}}
  .clock{font-family:var(--mincho);font-size:40px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:3.2em}
  .clock.warn{color:var(--ng)}
  .status{font-size:14px;color:var(--ink-2)}
  .status b{font-weight:600;color:var(--ink)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rec);margin-right:6px;vertical-align:middle;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .ctrls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .tr{margin-top:14px}
  .tr .lbl{font-size:12px;color:var(--muted);letter-spacing:.08em;display:flex;justify-content:space-between}
  .trbox{min-height:120px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface);font-size:15.5px;line-height:1.9;white-space:pre-wrap}
  .trbox .interim{color:var(--muted)}
  textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:inherit;font-size:15.5px;line-height:1.9;background:var(--surface);color:var(--ink)}
  textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .note{font-size:13px;color:var(--muted);margin:8px 0 0}
  .warnbox{background:var(--ochre-soft);color:var(--ochre);border-radius:8px;padding:10px 14px;font-size:13.5px;margin-top:10px}
  .score-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  .score-big{font-family:var(--mincho);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
  .score-big small{font-size:18px;color:var(--muted);margin-left:4px}
  .grade{font-family:var(--mincho);font-size:30px;padding:0 10px;border-radius:8px;line-height:1.3}
  .grade.A{background:var(--ok-soft);color:var(--ok)} .grade.B{background:var(--accent-soft);color:var(--accent)} .grade.C{background:var(--ochre-soft);color:var(--ochre)} .grade.D{background:var(--ng-soft);color:var(--ng)}
  .comment{color:var(--ink-2);margin:6px 0 0}
  .bars{display:grid;gap:8px;margin-top:16px}
  .bar{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;font-size:14px}
  .bar .lbl{display:flex;align-items:center;gap:8px}
  .bar .lbl .mark{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;flex:none}
  .mark.ok{background:var(--ok-soft);color:var(--ok)} .mark.ng{background:var(--ng-soft);color:var(--ng)} .mark.half{background:var(--ochre-soft);color:var(--ochre)}
  .bar .pts{font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
  .bar .trk{grid-column:1/-1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
  .bar .trk i{display:block;height:100%;background:var(--accent);border-radius:3px}
  .bar .hint{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin-top:-2px}
  .bar .hint b{color:var(--ink-2);font-weight:500}
  h3{font-family:var(--mincho);font-size:16px;margin:0 0 8px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  h3 .tag{font-family:var(--gothic);font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.08em}
  .model{white-space:pre-wrap;line-height:2;font-size:15px;max-width:48em}
  .vp{margin:0;padding-left:1.3em} .vp li{margin:2px 0}
  details{border-top:1px dashed var(--line);padding:8px 0}
  summary{cursor:pointer;color:var(--accent);font-weight:500}
  details p{margin:6px 0 0;color:var(--ink-2);padding-left:1em;border-left:2px solid var(--accent-soft)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .empty{color:var(--muted);text-align:center;padding:40px 10px;font-family:var(--mincho)}
  .src{font-size:12px;color:var(--muted);margin-top:14px}
  .hist{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .inapp{background:var(--ng-soft);color:var(--ng);border-bottom:1px solid var(--line);padding:10px 16px;font-size:14px;line-height:1.6;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .inapp a.btn{color:#fff;background:var(--ng);border-color:var(--ng);text-decoration:none;font-weight:600}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}
  .settings{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
  .settings select{font:inherit;font-size:13px;padding:3px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:220px}
  .settings label{display:flex;gap:6px;align-items:center}
  .vname{font-size:12px;color:var(--muted)}
  .vhelp{font-size:12.5px;color:var(--muted);margin:6px 0 0;line-height:1.6}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>校長口頭試問</h1>
  <span class="sub">音声版 ／ 読み上げ → 考える → 話す → 文字起こし → 100点採点</span>
  <span class="spacer"></span>
  <button class="btn" id="btnRandom">ランダム出題</button>
  <button class="btn ghost" id="btnReset">記録を消す</button>
</header>

<div class="inapp" id="inapp" hidden></div>

<div class="wrap">
  <nav class="list" id="list" aria-label="問題一覧"></nav>
  <main class="stage" id="stage">
    <section class="card">
      <div class="empty">左の一覧から問題を選ぶか、「ランダム出題」を押してください。<br><small>マイクと音声認識は Chrome・Edge・Safari で動きます。初回はマイクの許可を求められます。</small></div>
      <div class="settings" id="settings">
        <label>質問役の声 <select id="voiceSel"><option value="female">女性</option><option value="male">男性</option></select></label><span class="vname" id="vname"></span>
        <label>速さ <select id="rateSel"><option value="0.85">ゆっくり</option><option value="0.95" selected>ふつう</option><option value="1.05">速め</option></select></label>
        <label><input type="checkbox" id="hideQ"> 読み上げ中は問題文を隠す（聞き取り練習）</label>
        <button class="btn" id="btnTestVoice">声を試す</button>
      </div>
      <p class="vhelp" id="vhelp"></p>
      <p class="note" id="support"></p>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>// 自動生成: make_questions.py から。直すときは make_questions.py を直して再実行する。

 "grades": [

<script>// 口頭試問 採点エンジン（共通40点 + 問題別60点 = 100点）
// テキスト版・音声版の両方が同じ関数を使う。ビルド時に HTML に埋め込まれる。
(function () {
  function normalize(s) {
    return (s || "")
      .normalize("NFKC")
      .replace(/[\s　]+/g, "")
      .replace(/[、。，．,.!?！？「」『』（）()［］\[\]【】・:：;；\-–—～~]/g, "")
      .toLowerCase();
  }
  function hasAny(norm, terms) {
    for (const t of terms) {
      const nt = normalize(t);
      if (nt && norm.indexOf(nt) >= 0) return t;
    }
    return null;
  }
  function countDistinct(norm, terms) {
    const hits = [];
    for (const t of terms) { const nt = normalize(t); if (nt && norm.indexOf(nt) >= 0) hits.push(t); }
    return hits;
  }

  const CONCLUSION = ["と考えます", "と考えています", "と考えた", "からです", "と捉え", "と捉えています", "まず", "第一に", "取り組みます", "大切です", "重要です", "不可欠です", "を軸に", "を柱に", "最優先", "必要です", "ます。"];
  const STEPS = ["第一に", "第二に", "第三に", "一つ目", "二つ目", "三つ目", "ひとつめ", "ふたつめ", "みっつめ", "1つ目", "2つ目", "3つ目", "①", "②", "③", "まず", "次に", "さらに", "併せて", "あわせて", "最後に", "結びに", "加えて", "同時に", "並行して", "そのために", "その上で", "具体的には"];
  const PRINCIPAL = ["校長として", "校長である私", "校長の責任", "校長の判断", "責任", "最終的", "最終判断", "判断", "決断", "私が", "説明責任", "率先"];

  function scoreAnswer(q, text, elapsedSec, data) {
    const norm = normalize(text);
    const raw = (text || "").replace(/\s+/g, "");
    const len = raw.length;
    const items = [];

    // 1. 結論先出し
    const head60 = norm.slice(0, 60), head150 = norm.slice(0, 150);
    let c = 0, cHit = hasAny(head60, CONCLUSION);
    if (cHit) c = 10; else { cHit = hasAny(head150, CONCLUSION); if (cHit) c = 5; }
    items.push({ key: "conclusion", label: "結論を最初に述べている", got: c, max: 10, hits: cHit ? [cHit] : [], note: c === 10 ? "冒頭で立場を示せています" : c === 5 ? "立場表明が少し遅い。最初の一文で結論を" : "最初の一文で「私は〜と考えます」「まず〜に取り組みます」と結論を" });

    // 2. 具体策の列挙
    const sHits = countDistinct(norm, STEPS);
    const n = sHits.length;
    const s = n >= 3 ? 10 : n === 2 ? 7 : n === 1 ? 3 : 0;
    items.push({ key: "steps", label: "具体策を2〜3点、順序立てて述べている", got: s, max: 10, hits: sHits, note: n >= 3 ? "手順で数えて示せています" : "「第一に／第二に／第三に」と数えて示すと伝わります" });

    // 3. 校長の立場
    const pHits = countDistinct(norm, PRINCIPAL);
    const p = pHits.length >= 2 ? 10 : pHits.length === 1 ? 5 : 0;
    items.push({ key: "principal", label: "校長の立場（最終判断・責任）で答えている", got: p, max: 10, hits: pHits, note: p === 10 ? "最終責任者の立場が出ています" : "「最終的な判断と説明の責任は校長である私が負います」と結ぶと教頭との違いが出ます" });

    // 4. 分量
    let l = 0, lnote = "";
    if (len < 150) { l = 0; lnote = "短すぎます（" + len + "字）。350〜500字を目安に"; }
    else if (len < 250) { l = 5; lnote = "やや短い（" + len + "字）。具体策をもう1点"; }
    else if (len <= 600) { l = 10; lnote = "適切な分量です（" + len + "字）"; }
    else { l = 7; lnote = "やや長い（" + len + "字）。要点を絞り、詳細は追質問で"; }
    if (elapsedSec != null && elapsedSec > 0) {
      lnote += "／発話 " + Math.round(elapsedSec) + "秒";
      if (q.answer_sec && elapsedSec > q.answer_sec + 10) lnote += "（制限時間超過）";
    }
    items.push({ key: "length", label: "分量が適切（目安350〜500字）", got: l, max: 10, hits: [], note: lnote });

    // 5. 問題別キーワード（60点）
    const rub = [];
    for (const r of q.rubric) {
      const hit = hasAny(norm, r.terms);
      rub.push({ label: r.label, got: hit ? r.weight : 0, max: r.weight, hits: hit ? [hit] : [], terms: r.terms });
    }

    const common = items.reduce((a, b) => a + b.got, 0);
    const specific = rub.reduce((a, b) => a + b.got, 0);
    const total = Math.min(100, common + specific);
    const grades = (data && data.grades) || [];
    let grade = { label: "-", comment: "" };
    for (const g of grades) { if (total >= g.min) { grade = g; break; } }
    const missing = rub.filter(r => r.got === 0).map(r => r.label);
    return { total, common, specific, items, rubric: rub, grade, missing, chars: len };
  }

  window.KotoScoring = { normalize, scoreAnswer };
})();

// 論作文 採点エンジン（資料③「合格ラインに達する論文の型」に基づく。型80点 + 内容20点 = 100点）
(function () {
  function norm(s){ return (s||"").normalize("NFKC").replace(/[\s　]+/g,""); }
  function hasAny(t, terms){ for(const x of terms){ if(x && t.indexOf(x)>=0) return x; } return null; }
  function count(t, re){ const m = t.match(re); return m ? m.length : 0; }

  function score(es, raw, data){
    const text = (raw||"").replace(/\r/g,"");
    const n = norm(text);
    const len = n.length;
    const items = [], advice = [];
    const mp = es.model_parts || {};

    // 1. 字数
    let c = 0, cnote;
    const [lo, hi] = es.chars || [500, 600];
    if(len >= lo && len <= hi){ c = 10; cnote = `${len}字（${lo}〜${hi}字）`; }
    else if(len >= lo-20 && len <= hi+20){ c = 6; cnote = `${len}字。${lo}〜${hi}字に収める`; }
    else if(len >= lo-50 && len <= hi+60){ c = 3; cnote = `${len}字。${len<lo?"不足":"超過"}が大きい`; }
    else { c = 0; cnote = `${len}字。${len<lo?"大幅に不足":"大幅に超過"}（${lo}〜${hi}字）`; }
    items.push({key:"chars", label:"字数", got:c, max:10, note:cnote});
    if(c < 10) advice.push(len < lo ? "字数不足。各策の「具体的には」の後を1〜2文厚くする（手立ての中身・効果）。" : "字数超過。序論の背景説明と重複した説明を削る。見出しは1行に。");

    // 2. 序論の型（最初の段落 or 先頭160字）
    const introEnd = text.indexOf("\n") > 0 ? text.indexOf("\n") : 160;
    const intro = norm(text.slice(0, Math.max(introEnd, 120)));
    let i = 0; const ih = [];
    if(/そこで/.test(intro)){ i += 5; ih.push("そこで"); }
    if(/校長として/.test(intro)){ i += 5; ih.push("校長として"); }
    if(/(2つの策|二つの策|2点|二点|2策|次の2|以下の2|2つの施策|2つの柱)/.test(intro)){ i += 5; ih.push("2つの策"); }
    items.push({key:"intro", label:"序論の型", got:i, max:15, note: i===15 ? "型どおりの序論です" : "序論に「そこで、私は校長として、〜に向けて、次の2つの策を講じる。」を", hits: ih});
    if(i < 15 && mp.intro) advice.push("序論の型（解答例）: 「" + mp.intro.slice(-70) + "」");
    if(/現任校|勤務校|本校では/.test(intro)) advice.push("序論に現任校の実態を書かない。実態は策の本文の「そこで私は」の前に書く。");

    // 3. 見出し2本
    const lines = text.split("\n").map(s=>s.trim()).filter(Boolean);
    const heads = lines.filter(l => /^[12１２一二][\s　．.、）)]?\S/.test(l) && norm(l).length <= 45 && !/。$/.test(l));
    const headsWithPeriod = lines.filter(l => /^[12１２一二][\s　．.、）)]?\S/.test(l) && norm(l).length <= 45 && /。$/.test(l));
    let h = heads.length >= 2 ? 15 : heads.length === 1 ? 7 : 0;
    let hnote = heads.length >= 2 ? "見出し2本: " + heads.map(x=>"「"+x+"」").join(" ") : heads.length===1 ? "見出しが1本だけ。策2の見出しを立てる" : "見出し（ねらい）が見つからない。「1 〇〇し、△△する」を改行して1行で";
    if(headsWithPeriod.length){ hnote += "／見出しに句点をつけない"; if(h>0) h -= 2; }
    items.push({key:"headings", label:"策の見出し2本", got:h, max:15, note:hnote});
    if(h < 15 && mp.headings && mp.headings.length) advice.push("見出しの型（解答例）: " + mp.headings.map(x=>"「"+x+"」").join("／") + "。後段はねらいの言葉で結ぶ。");
    if(lines.length < 3) advice.push("序論・見出し1・本文1・見出し2・本文2・結び を改行で分ける（答案用紙と同じ段落構成）。");

    // 4. 策の展開
    const sokode = count(n, /そこで私は/g);
    const gutai = count(n, /(具体的には|具体的に|例えば|具体策として)/g);
    const effect = count(n, /(ことで|ことにより|これにより|を通じて|を通して|積み重ねにより|により)[^。]{0,60}(する|図る|努める|つなげる|繋げる|実現する|構築する|醸成する|高める|育成する|確保する|推進する|させる|確立する|創る|整える|保障する|定着させる)。/g);
    let d = 0;
    d += sokode >= 2 ? 7 : sokode === 1 ? 3 : 0;
    d += gutai >= 2 ? 7 : gutai === 1 ? 3 : 0;
    d += effect >= 2 ? 6 : effect === 1 ? 3 : 0;
    items.push({key:"develop", label:"策の展開", got:d, max:20, note:`「そこで私は」${sokode}回／「具体的には」${gutai}回／効果で結ぶ文 ${effect}回（各2回が目安）`});
    if(sokode < 2) advice.push("各策の本文で、論（なぜ必要か）の後に「そこで私は、〜する。」と手立てを1つにしぼって示す。");
    if(gutai < 2) advice.push("「具体的には、〜」の後が最も重要。誰が・何を・どう行うかを書く（新しい用語には補足説明を添える）。");
    if(effect < 2) advice.push("各策の末尾を「〜することで、△△する。」と、見出しのねらいの言葉で結ぶ。");

    // 5. 結び
    const tail = norm(text.slice(-160));
    let k = 0; const kh = [];
    const kw = hasAny(tail, ["決意である","所存である","覚悟である","邁進する","邁進し","全力を尽くす","全力を傾注","万全を期す","尽力する","任にあたる","創り上げる","具現化する","全力で","一丸となり","築き上げ"]);
    if(kw){ k += 6; kh.push(kw); }
    if(/校長として|私は校長|私は、|私は強い|教職員と一丸|教職員と共に/.test(tail)){ k += 4; kh.push("校長の決意"); }
    items.push({key:"closing", label:"結び（決意）", got:k, max:10, note: k===10 ? "校長としての決意で結べています" : "結びは「私は校長として、〜に全力を尽くす所存である。」のように", hits: kh});
    if(k < 10 && mp.closing) advice.push("結びの型（解答例）: 「" + mp.closing.slice(-60) + "」");

    // 6. 文体・立場
    let s = 0; const sh = [];
    const desu = count(n, /(です|ます|でしょう)[。、]/g);
    const dearu = count(n, /(である|する|努める|図る|講じる|構築する)。/g);
    if(desu <= 1 && dearu >= 3){ s += 5; sh.push("である調"); }
    else if(desu > 1) advice.push("「です・ます」が混在。論文は「である」調で統一する。");
    const shieki = count(n, /(させる|させ、|に努めさせ|を図らせ|させることで)/g);
    const kocho = count(n, /校長として|校長の|校長室|教職員に|全教職員|率先|私は/g);
    if(kocho >= 2){ s += 5; sh.push(shieki >= 1 ? "校長の立場・使役" : "校長の立場"); if(shieki === 0) advice.push("（任意）校長論文は使役表現も使うと立場が明確になる: 職員を動かすときは「〜させる」「〜に努めさせる」、自ら動くときは「〜する」。"); }
    else if(kocho === 1){ s += 3; sh.push("校長の立場（弱）"); advice.push("管理職の立場（学校運営の視点）をもう1か所。「校長として」「教職員に〜させる」。"); }
    else advice.push("管理職の立場（学校運営の視点）が弱い。「校長として」「教職員に〜させる」を入れる。");
    items.push({key:"style", label:"文体と立場", got:s, max:10, note: sh.length ? sh.join("・")+" OK" : "である調・校長の立場で", hits: sh});

    // 7. 内容（解答例の要点）
    const rub = [];
    for(const r of es.rubric){ const hit = hasAny(n, r.terms); rub.push({label:r.label, got: hit? r.weight:0, max:r.weight, hits: hit?[hit]:[], terms:r.terms}); }
    const content = rub.reduce((a,b)=>a+b.got,0);
    const missing = rub.filter(r=>r.got===0);
    if(missing.length) advice.push("内容で抜けている観点: " + missing.map(m=>m.label+"（例: "+m.terms.slice(0,3).join("・")+"）").join("／"));

    // ねらい（題名の言葉）の反復回数
    const nerai = es.nerai || (es.title||"").replace(/[（(].*?[）)]/g,"").split(/[・、／]/)[0].slice(0,8);
    const neraiCount = nerai ? count(n, new RegExp(nerai.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "g")) : 0;
    if(nerai && neraiCount < 3) advice.push(`ねらいの言葉「${nerai}」が${neraiCount}回。序論・見出し1・本文1末・見出し2・本文2末の5か所で繰り返す。`);

    const form = items.reduce((a,b)=>a+b.got,0);
    const total = Math.min(100, form + content);
    let grade = {label:"-", comment:""};
    for(const g of (data.grades||[])){ if(total >= g.min){ grade = g; break; } }
    return { total, form, content, items, rubric: rub, advice, grade, chars: len, neraiCount };
  }
  window.KotoEssay = { score };
})();

<script>
(function(){
  const D = window.KOTO_DATA, QS = D.questions;
  const ED = window.KOTO_ESSAYS, SETS = ED.sets, ESSAYS = ED.essays;
  const STORE = "koto_voice_v1";
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const synth = window.speechSynthesis;
  let state = load(), prefs = loadPrefs();
  let cur = null, phase = "idle", timer = null, remain = 0;
  let rec = null, recActive = false, finalText = "", interimText = "", answerStart = 0, answerEnd = 0, lastRes = null;
  let fallbackMode = !SR;

  function load(){ try{ return JSON.parse(localStorage.getItem(STORE)||"{}"); }catch(e){ return {}; } }
  function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }
  function loadPrefs(){ try{ return JSON.parse(localStorage.getItem(STORE+"_prefs")||"{}"); }catch(e){ return {}; } }
  function savePrefs(){ try{ localStorage.setItem(STORE+"_prefs", JSON.stringify(prefs)); }catch(e){} }
  function rec_(id){ return state[id] || (state[id] = {}); }
  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
  function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }
  function mmss(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
  function $(id){ return document.getElementById(id); }

  // ─ 読み上げ（TTS）─
  // 玩具っぽい声（Eddy, Flo, Grandma, Grandpa, Reed, Rocko, Sandy, Shelley など）は候補から外し、
  // OSごとに最も自然な声を 女性／男性 で1つずつ選ぶ。
  const NOVELTY = /Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Bells|Bubbles|Bad News|Boing|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Albert|Fred|Junior|Kathy|Ralph/i;
  const RANK = {
    female: [/Kyoko.*(Premium|プレミアム)/i, /premium.*Kyoko/i, /Kyoko.*(Enhanced|拡張)/i, /enhanced.*Kyoko/i, /Nanami.*Natural/i, /Google 日本語/i, /Nanami/i, /Kyoko/i, /O-Ren/i, /Ayumi/i, /Haruka/i],
    male:   [/Otoya.*(Premium|プレミアム)/i, /premium.*Otoya/i, /Otoya.*(Enhanced|拡張)/i, /enhanced.*Otoya/i, /Keita.*Natural/i, /Keita/i, /Otoya/i, /Ichiro/i, /Hattori/i],
  };
  let voices = [];
  function refreshVoices(){
    voices = synth ? synth.getVoices().filter(v => /^ja/i.test(v.lang) && !NOVELTY.test(v.name)) : [];
    const sel = $("voiceSel"); if(sel) sel.value = prefs.gender || "female";
    updateVoiceName();
  }
  function findVoice(gender){
    for(const re of RANK[gender]){
      const v = voices.find(v => re.test(v.name) || re.test(v.voiceURI||""));
      if(v) return v;
    }
    return null;
  }
  function pickVoice(){
    const g = prefs.gender || "female";
    return findVoice(g) || findVoice(g==="female"?"male":"female") || voices[0] || null;
  }
  function updateVoiceName(){
    const n = $("vname"); if(!n) return;
    const g = prefs.gender || "female", v = findVoice(g);
    if(!voices.length){ n.textContent = "（日本語の声が見つかりません）"; return; }
    if(v){ n.textContent = "使用中: " + v.name + (/(Premium|Enhanced|プレミアム|拡張|Natural|premium|enhanced)/i.test(v.name + (v.voiceURI||"")) ? "（高品質）" : ""); }
    else { n.textContent = (g==="male" ? "男性の声が未インストールのため女性の声で読みます" : "女性の声が見つからないため別の声で読みます"); }
    const help = $("vhelp"); if(help){
      const isMac = /Mac/i.test(navigator.platform||"") || /Macintosh/i.test(navigator.userAgent);
      help.innerHTML = isMac
        ? "より自然な声にするには、Mac の<b>システム設定 › アクセシビリティ › 読み上げコンテンツ › システムの声 › 管理</b>で、日本語の <b>Kyoko（プレミアム）</b>（女性）と <b>Otoya（プレミアム）</b>（男性）をダウンロードし、ブラウザを再読み込みしてください。"
        : "より自然な声にするには、Edge（Nanami／Keita の Natural 音声）か、Windows の設定で日本語の音声パックを追加してください。";
    }
  }
  if(synth){ refreshVoices(); synth.onvoiceschanged = refreshVoices; }
  function speak(text, opts){
    opts = opts || {};
    return new Promise(resolve => {
      if(!synth){ resolve(); return; }
      synth.cancel();
      const chunks = text.replace(/\n+/g,"。").split(/(?<=[。？！])/).map(s=>s.trim()).filter(Boolean);
      if(!chunks.length){ resolve(); return; }
      const v = pickVoice(), rate = parseFloat(($("rateSel")||{}).value || prefs.rate || "0.95");
      const male = v && RANK.male.some(re => re.test(v.name) || re.test(v.voiceURI||""));
      let i = 0, done = false;
      const finish = () => { if(!done){ done=true; resolve(); } };
      const next = () => {
        if(i >= chunks.length){ finish(); return; }
        const u = new SpeechSynthesisUtterance(chunks[i++]);
        u.lang = "ja-JP"; if(v) u.voice = v; u.rate = rate; u.pitch = male ? 0.95 : 1.0;
        // 文の切れ目に、人が息を継ぐ程度の間を置く
        u.onend = () => setTimeout(next, opts.pause != null ? opts.pause : 320);
        u.onerror = next;
        synth.speak(u);
      };
      next();
      setTimeout(finish, text.length*300/rate + 4000);
    });
  }
  function stopSpeak(){ if(synth) synth.cancel(); }

  // ─ 一覧 ─
  function renderList(){
    const el = $("list");

      h += '<button class="qbtn'+(cur&&cur._set===st.id?' active':'')+'" data-set="'+st.id+'"><span class="no">'+st.no+'</span><span>'+esc(st.title)+'</span>'+sc+'</button>';

  }

  // ─ 出題画面 ─
  function open(id){ const q = QS.find(x=>x.id===id); if(q) openQ(q); }
  function openQ(q){
    abortAll();
    cur = q; phase="idle"; finalText=""; interimText=""; lastRes=null;
    const r = rec_(cur.id);
    const hist = (r.history||[]).map(h=>h.s+"点").join(" → ");
    $("stage").innerHTML = `

        <div class="console">
          <span class="clock" id="clock">${mmss(cur.think_sec)}</span>

          <label>速さ <select id="rateSel"><option value="0.85">ゆっくり</option><option value="0.95">ふつう</option><option value="1.05">速め</option></select></label>
          <label><input type="checkbox" id="hideQ" ${prefs.hideQ?'checked':''}> 読み上げ中は問題文を隠す</label>

    refreshVoices();
    $("rateSel").value = prefs.rate || "0.95";
    $("voiceSel").addEventListener("change", e => { prefs.gender = e.target.value; savePrefs(); updateVoiceName(); });
    $("rateSel").addEventListener("change", e => { prefs.rate = e.target.value; savePrefs(); });
    $("hideQ").addEventListener("change", e => { prefs.hideQ = e.target.checked; savePrefs(); $("qtext").classList.toggle("hidden-q", e.target.checked); });
    $("btnStart").addEventListener("click", startRead);
    $("btnSkip").addEventListener("click", () => { if(phase==="read"){ stopSpeak(); startThink(); } else if(phase==="think"){ startAnswer(); } });
    $("btnStop").addEventListener("click", finishAnswer);

    renderList();

  }
  // ─ LINE などアプリ内ブラウザの検出 → Chrome / Safari へ誘導 ─
  (function detectInApp(){
    const ua = navigator.userAgent || "";
    const isLine = /\bLine\//i.test(ua);
    const isAndroidWV = /Android/i.test(ua) && (/\bwv\b/.test(ua) || isLine);
    const isIOSInApp = /iPhone|iPad/i.test(ua) && !/Safari\//i.test(ua);
    if(!(isLine || isAndroidWV || isIOSInApp)) return;
    const box = $("inapp"); if(!box) return;
    const isHttp = /^https?:/.test(location.href);
    let h = "<span><b>このままではマイクが使えません。</b>";
    if(/Android/i.test(ua)){
      h += " 右上の「︙」→「他のアプリで開く」→ <b>Chrome</b> を選んでください。</span>";
      if(isHttp){
        const u = location.href.replace(/^https?:\/\//, "");
        h += '<a class="btn" href="intent://' + u + '#Intent;scheme=https;package=com.android.chrome;end">Chromeで開く</a>';
      }
    } else {
      h += " 右下の共有ボタン →「<b>Safariで開く</b>」を選んでください。</span>";
    }
    box.innerHTML = h; box.hidden = false;
  })();
  function showSupport(){
    const s = $("support"); if(!s) return;
    if(!SR) s.innerHTML = "このブラウザは音声認識に対応していません（Firefoxなど）。回答は<b>キーボード入力</b>に切り替わります。Chrome・Edge・Safari を推奨します。";
    else if(!synth) s.textContent = "読み上げ機能が使えないため、問題文は画面で読んでください。";
    else s.textContent = "";
  }
  function setStep(s){ document.querySelectorAll(".step").forEach(e => { const order=["read","think","answer","result"]; const i=order.indexOf(e.dataset.s), j=order.indexOf(s); e.classList.toggle("on", i===j); e.classList.toggle("done", i<j); }); }
  function setStatus(h){ const s=$("status"); if(s) s.innerHTML=h; }
  function setClock(v, warn){ const c=$("clock"); if(c){ c.textContent=mmss(v); c.classList.toggle("warn", !!warn); } }
  function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }
  function abortAll(){ stopTimer(); stopSpeak(); stopRec(true); }

  // ─ ① 読み上げ ─
  async function startRead(){
    phase="read"; setStep("read");
    $("btnStart").hidden=true; $("btnSkip").hidden=false; $("btnSkip").textContent="読み上げを飛ばす";
    setStatus("<b>問題を読み上げています。</b>");
    $("qtext").classList.toggle("hidden-q", !!prefs.hideQ);
    await speak("では、お聞きします。" + cur.question.replace(/（補作）/g,"") + " どうぞ、考えてください。");
    if(phase==="read") startThink();
  }
  // ─ ② 考える ─
  function startThink(){
    stopSpeak(); phase="think"; setStep("think"); remain=cur.think_sec;
    $("qtext").classList.remove("hidden-q");
    $("btnSkip").hidden=false; $("btnSkip").textContent="すぐ話す";
    setStatus("<b>考える時間。</b>結論・根拠・具体策2〜3点・校長の責任、の順に組み立てる。");
    setClock(remain);
    timer = setInterval(() => { remain--; setClock(remain, remain<=5); if(remain<=0) startAnswer(); }, 1000);
  }
  // ─ ③ 話す ─
  function startAnswer(){
    stopTimer(); stopSpeak(); phase="answer"; setStep("answer"); remain=cur.answer_sec;
    $("btnSkip").hidden=true; $("btnStop").hidden=false; $("trwrap").hidden=false;
    finalText=""; interimText=""; renderTr();
    answerStart = Date.now();
    setClock(remain);
    timer = setInterval(() => { remain--; setClock(remain, remain<=15); if(remain<=0) finishAnswer(); }, 1000);
    if(fallbackMode){ renderFallback(); setStatus("<b>回答中（キーボード入力）。</b>話す内容をそのまま打ち込んでください。"); return; }
    speak("はい、どうぞ。", {pause:0});
    startRec();
    setStatus('<span class="dot"></span><b>録音中。</b>面接官に向かって話すように、はっきりと。');
  }
  function renderFallback(){
    $("trbox").outerHTML = `<textarea id="trbox" placeholder="ここに回答を入力（音声認識が使えないときの代替）"></textarea>`;
    $("trbox").addEventListener("input", e => { finalText = e.target.value; $("trcnt").textContent = finalText.replace(/\s+/g,"").length+"字"; });
    $("trbox").focus();
  }
  function renderTr(){
    const b=$("trbox"); if(!b || b.tagName==="TEXTAREA") return;
    b.innerHTML = esc(finalText) + (interimText ? '<span class="interim">'+esc(interimText)+'</span>' : '');
    $("trcnt").textContent = (finalText+interimText).replace(/\s+/g,"").length+"字";
    b.scrollTop = b.scrollHeight;
  }
  function startRec(){
    try{
      rec = new SR(); rec.lang="ja-JP"; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
      rec.onresult = e => {
        let interim="";
        for(let i=e.resultIndex;i<e.results.length;i++){
          const t = e.results[i][0].transcript;
          if(e.results[i].isFinal) finalText += t.trim() + "。"; else interim += t;
        }
        interimText = interim; renderTr();
      };
      rec.onerror = e => {
        if(e.error==="no-speech" || e.error==="aborted") return;
        if(e.error==="not-allowed" || e.error==="service-not-allowed"){
          recActive=false; fallbackMode=true;
          toast("マイクが許可されていません。キーボード入力に切り替えます");
          renderFallback(); setStatus("<b>回答中（キーボード入力）。</b>マイク許可後に再読み込みすると音声で答えられます。");
          return;
        }
        if(e.error==="network"){ toast("音声認識サービスに接続できません（ネット接続を確認）"); }
      };
      rec.onend = () => { if(recActive && phase==="answer"){ try{ rec.start(); }catch(err){} } };
      recActive=true; rec.start();
    }catch(err){ fallbackMode=true; renderFallback(); }
  }
  function stopRec(silent){
    recActive=false;
    if(rec){ try{ rec.onend=null; rec.stop(); }catch(e){} rec=null; }
    if(!silent && interimText){ finalText += interimText.trim()+"。"; interimText=""; renderTr(); }
  }
  // ─ ④ 採点 ─
  function finishAnswer(){
    if(phase!=="answer") return;
    stopTimer(); answerEnd = Date.now();
    stopRec(false);
    phase="result"; setStep("result");
    $("btnStop").hidden=true;
    const text = finalText.trim();
    if(text.replace(/\s+/g,"").length < 20){
      setStatus("<b>文字起こしがほとんどありません。</b>マイクの入力レベルを確認して、もう一度どうぞ。");
      $("result").innerHTML = `<section class="card"><div class="actions"><button class="btn primary" id="btnAgain">もう一度答える</button><button class="btn" id="btnPeek">模範解答だけ見る</button></div></section>`;
      $("btnAgain").addEventListener("click", startAnswer);
      $("btnPeek").addEventListener("click", () => showResult(null));
      return;
    }
    setStatus("<b>採点しました。</b>文字起こしに誤りがあれば直して「再採点」できます。");
    scoreAndShow(text);
  }
  function scoreAndShow(text){
    const elapsed = (answerEnd - answerStart)/1000;
    const res = window.KotoScoring.scoreAnswer(cur, text, elapsed, D);
    lastRes = res;
    const r = rec_(cur.id);
    r.last = res.total; r.lastText = text; r.lastAt = Date.now();
    if(r.best==null || res.total > r.best){ r.best = res.total; r.bestGrade = res.grade.label; }
    r.history = (r.history||[]).slice(-9).concat([{t:Date.now(), s:res.total}]);
    save(); renderList();
    showResult(res, text);
  }
  function bar(it){
    const ratio = it.max ? it.got/it.max : 0;
    const mk = it.got===it.max ? "ok" : it.got>0 ? "half" : "ng";
    const sym = mk==="ok"?"✓":mk==="half"?"△":"×";
    let hint = it.note ? esc(it.note) : it.got===0 ? "例：<b>"+it.terms.slice(0,4).map(esc).join("</b>・<b>")+"</b> などの語で触れる" : "「<b>"+esc(it.hits[0])+"</b>」に触れています";
    return `<div class="bar"><span class="lbl"><span class="mark ${mk}">${sym}</span>${esc(it.label)}</span><span class="pts">${it.got} / ${it.max}</span><span class="trk"><i style="width:${ratio*100}%"></i></span><span class="hint">${hint}</span></div>`;
  }
  function showResult(res, text){
    const el = $("result");
    let h = "";
    if(res){
      h += `<section class="card">
        <div class="score-head"><span class="score-big">${res.total}<small>/ 100</small></span><span class="grade ${res.grade.label}">${res.grade.label}</span><span class="comment">${esc(res.grade.comment)}</span></div>
        <h3 style="margin-top:18px">共通の観点 <span class="tag">${res.common} / 40</span></h3>
        <div class="bars">${res.items.map(bar).join("")}</div>
        <h3 style="margin-top:18px">この問いの観点 <span class="tag">${res.specific} / 60</span></h3>
        <div class="bars">${res.rubric.map(bar).join("")}</div>
        ${res.missing.length ? `<p class="comment" style="margin-top:12px">抜けていた観点：${res.missing.map(esc).join("／")}</p>` : ""}
        <h3 style="margin-top:18px">あなたの回答（文字起こし） <span class="tag">${res.chars}字 ／ 誤認識は直してから再採点</span></h3>
        <textarea id="editTr">${esc(text||"")}</textarea>
        <div class="actions"><button class="btn" id="btnRescore">修正して再採点</button><button class="btn" id="btnReadMine">自分の回答を聞く</button></div>
        <div class="warnbox">採点はキーワードと構成の自動判定です。言い回しが違って×になった観点は、模範解答と見比べて自分で判断してください。</div>
      </section>`;
    }
    h += `<section class="card">
      <h3>模範解答 <span class="tag">${esc(cur.source)}</span> <button class="btn ghost" id="btnReadModel">▶ 読み上げる</button></h3>
      <div class="model">${esc(cur.model_answer)}</div>
      <h3 style="margin-top:18px">評価の観点</h3>
      <ul class="vp">${cur.viewpoints.map(v=>"<li>"+esc(v)+"</li>").join("")}</ul>
      <h3 style="margin-top:18px">追質問 <span class="tag">読み上げを聞いて口頭で答えてから開く</span></h3>
      ${cur.followups.map((f,i)=>`<details><summary>${esc(f.q)} <button class="btn ghost" data-fu="${i}" style="padding:2px 8px;font-size:12px">▶ 読み上げ</button></summary><p>${esc(f.a)}</p></details>`).join("")}
      <div class="actions">
        <button class="btn" id="btnAgain2">同じ問題にもう一度答える</button>
        <button class="btn primary" id="btnNext">次の問題へ</button>
      </div>
      <p class="src">出典：${esc(cur.source)}</p>
    </section>`;
    el.innerHTML = h;
    if(res){
      $("btnRescore").addEventListener("click", () => { answerEnd = answerEnd||Date.now(); scoreAndShow($("editTr").value); });
      $("btnReadMine").addEventListener("click", () => speak($("editTr").value));
    }
    $("btnReadModel").addEventListener("click", () => speak(cur.model_answer));
    el.querySelectorAll("[data-fu]").forEach(b => b.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); speak(cur.followups[+b.dataset.fu].q); }));
    $("btnAgain2").addEventListener("click", () => { el.innerHTML=""; startThink(); });
    $("btnNext").addEventListener("click", () => { if(cur._set){ const k=SETS.findIndex(x=>x.id===cur._set); openSet(SETS[(k+1)%SETS.length].id); return; } const i=QS.findIndex(q=>q.id===cur.id); open(QS[(i+1)%QS.length].id); });
    el.scrollIntoView({behavior:"smooth", block:"start"});
  }


  // ─ 2問1セット（問1 一問一答 → 問2 校長としての論述）─
  function setToQ2(st, es){
    const q2 = es.q2.replace(/あなたの考えを[^。]*。?/g, "").replace(/（補作）/g,"").trim() + " 1分考え2分で答えてください。";
    return { id: st.id+"-q2", _set: st.id, no: "セット"+st.no+" 問2", title: st.title, category: "2問1セット",
      question: q2, think_sec: 60, answer_sec: 120, source: es.source,
      viewpoints: es.viewpoints, model_answer: (es.model_answer || es.reference || "") + "\n（論文の解答例。口頭では、序論の結論 → 策1 → 策2 → 結び の順で2分に収める）",
      followups: [], rubric: es.rubric.map(r => ({label:r.label, weight:r.weight*3, terms:r.terms})) };
  }
  function normA(s){ return (s||"").normalize("NFKC").replace(/[\s　「」『』（）()、。・,.]/g,"").toLowerCase(); }
  function openSet(id){
    abortAll();
    const st = SETS.find(x=>x.id===id), es = ESSAYS.find(e=>e.id===st.essay);
    cur = { _set: st.id, id: st.id, no: "セット"+st.no };
    const j = rec_(st.id);
    $("stage").innerHTML = `
      <section class="card">
        <div class="eyebrow"><span class="pill">セット${st.no} 問1</span><span>一問一答</span><span>${esc(st.title)}</span></div>
        <p class="qtext">${esc(es.q1.question)}</p>
        <div class="console">
          <span class="clock" id="clock">00:15</span>
          <span class="status" id="status"><b>問1。</b>読み上げのあと、声で（または入力で）短く答えてください。</span>
          <span class="ctrls"><button class="btn primary" id="btnStart">開始（読み上げ）</button><button class="btn" id="btnMic" hidden>🎤 声で答える</button></span>
        </div>
        <div class="tr" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><input type="text" id="a1" placeholder="答え" value="${esc(j.a1||"")}" style="flex:1;min-width:200px;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:inherit;background:var(--surface);color:var(--ink)"><button class="btn" id="btnJudge">答え合わせ</button></div>
        <div id="judge"></div>
        <div class="actions"><button class="btn primary" id="btnToQ2" hidden>問2へ（読み上げ → 1分考え → 2分で答える）</button></div>
      </section>`;
    const judgeFn = () => {
      const v = $("a1").value.trim(); if(!v){ toast("答えを入力してください"); return; }
      const nv = normA(v);
      const ok = es.q1.accept.some(a => nv.indexOf(normA(a))>=0 || (normA(a).length>=4 && normA(a).indexOf(nv)>=0 && nv.length>=4));
      j.a1 = v; j.j1 = ok; save(); renderList();
      $("judge").innerHTML = `<div class="warnbox" style="background:${ok?'var(--ok-soft)':'var(--ng-soft)'};color:${ok?'var(--ok)':'var(--ng)'}"><b>${ok?"○ 正解":"× 不正解"}</b>　正答: ${esc(es.q1.answer)}<br><span style="color:var(--ink-2);font-size:13px">${esc(es.q1.note||"")}</span></div>`;
      $("btnToQ2").hidden = false;
      speak((ok ? "正解です。" : "正答は、") + (ok ? "" : es.q1.answer + "、です。"));
    };
    $("btnJudge").addEventListener("click", judgeFn);
    $("a1").addEventListener("keydown", e => { if(e.key==="Enter") judgeFn(); });
    $("btnStart").addEventListener("click", async () => {
      $("btnStart").disabled = true;
      setStatus("<b>問1を読み上げています。</b>");
      await speak("セット" + st.no + "、問1。" + es.q1.question.replace(/（補作）/g,"") + " どうぞ。", {});
      setStatus("<b>どうぞ。</b>声で答えるか、入力して「答え合わせ」。");
      if(SR && !fallbackMode){ $("btnMic").hidden = false; listenOnce(); }
      else $("a1").focus();
    });
    $("btnMic").addEventListener("click", listenOnce);
    function listenOnce(){
      if(!SR) return;
      try{
        const r1 = new SR(); r1.lang="ja-JP"; r1.continuous=false; r1.interimResults=true; r1.maxAlternatives=1;
        setStatus('<span class="dot"></span><b>聞いています。</b>短く答えてください。');
        let got = "";
        r1.onresult = e => { got = Array.from(e.results).map(x=>x[0].transcript).join(""); $("a1").value = got; };
        r1.onerror = () => { setStatus("<b>聞き取れませんでした。</b>もう一度「声で答える」か、入力してください。"); };
        r1.onend = () => { if(got){ setStatus("<b>聞き取りました。</b>「答え合わせ」を押してください。"); } };
        r1.start();
        setTimeout(()=>{ try{ r1.stop(); }catch(e){} }, 15000);
      }catch(e){ $("a1").focus(); }
    }
    $("btnToQ2").addEventListener("click", () => { openQ(setToQ2(st, es)); startRead(); });
    renderList(); window.scrollTo({top:0});
  }
  // ─ ヘッダ操作 ─
  $("btnRandom").addEventListener("click", () => {
    const un = QS.filter(q => !(state[q.id]&&state[q.id].best!=null));
    const pool = un.length ? un : QS;
    open(pool[Math.floor(Math.random()*pool.length)].id); startRead();
  });
  $("btnReset").addEventListener("click", () => {
    const b = $("btnReset");
    if(b.dataset.arm){ state={}; save(); renderList(); toast("記録を消しました"); delete b.dataset.arm; b.textContent="記録を消す"; }
    else { b.dataset.arm="1"; b.textContent="もう一度押すと消えます"; setTimeout(()=>{ delete b.dataset.arm; b.textContent="記録を消す"; },3000); }
  });
  const tv = $("btnTestVoice"); if(tv) tv.addEventListener("click", () => speak("それでは、面接を始めます。リラックスして、お答えください。"));
  const hq = $("hideQ"); if(hq){ hq.checked=!!prefs.hideQ; hq.addEventListener("change", e => { prefs.hideQ=e.target.checked; savePrefs(); }); }
  const vs = $("voiceSel"); if(vs) vs.addEventListener("change", e => { prefs.gender=e.target.value; savePrefs(); updateVoiceName(); });
  showSupport();
  renderList();
})();
</script>
</body>
</html>
